function showArea(fileName,label){

    document.getElementById(
        "menu-screen"
    ).style.display="none";

    document.getElementById(
        "detail-screen"
    ).style.display="block";

    document.getElementById(
        "title"
    ).textContent=label;

    document.getElementById(
        "detail-image"
    ).src=fileName;

    const info=
        genreInfo[label]||{};

    document.getElementById(
        "location"
    ).textContent=
        info.location || "";

    document.getElementById(
        "message"
    ).textContent=
        info.detail || "";
}

function showMenu(){

    document.getElementById(
        "detail-screen"
    ).style.display="none";

    document.getElementById(

}

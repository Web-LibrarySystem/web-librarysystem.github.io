<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>図書館案内アプリ</title>

<style>

body{
    margin:0;
    padding:15px;
    font-family:sans-serif;
    background:#f5f7fa;
}

h1{
    margin-top:0;
    text-align:center;
}

.section{

    margin-bottom:20px;

    padding:10px;

    border-radius:12px;

    background:white;

    box-shadow:
    0 2px 8px rgba(0,0,0,0.08);
}

.section-title{

    font-size:22px;

    font-weight:bold;

    margin-bottom:10px;
}

.button-area{

    display:flex;

    flex-wrap:wrap;

    gap:10px;
}

.genre-btn{

    width:15%;

    min-height:90px;

    border:none;

    border-radius:12px;

    background:#ffffff;

    box-shadow:
    0 2px 6px rgba(0,0,0,0.08);

    font-size:18px;

    cursor:pointer;
}

.top-bar{

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    width:100%;
}

#title{

    text-align:center;

    font-size:48px;

    margin-top:-70px;

    margin-bottom:15px;
}

#location{
    text-align:center;
    font-weight:bold;
    color:#003366;
    margin-bottom:15px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

#detail-screen{

    display:none;

    text-align:center;

    position:relative;
}

#detail-image{

    max-width:100%;

    max-height:1100px;
}

.back-button{

    font-size:20px;

    padding:10px 20px;

    border:none;

    border-radius:12px;

    margin-bottom:15px;
}

#message{

    text-align:left;

    max-width:800px;

    margin:20px auto 0 auto;

    font-size:20px;

    line-height:1.6;
}

#home-button{

    font-size:20px;

    padding:10px 20px;

    border:none;

    border-radius:12px;

    background:white;

    box-shadow:
    0 2px 6px rgba(0,0,0,0.1);

    cursor:pointer;

    margin-bottom:10px;
}



</style>
</head>

<body>

<div id="menu-screen">

    <button
        id="home-button"

<div id="detail-screen">

    <div class="top-bar">

        <button
        class="back-button"
        onclick="showMenu()">
        ← 戻る
        </button>
    </div>

    <h2 id="title"></h2>
 
    <div id="location"></div>
 
    <img
    id="detail-image"
    src=""
    alt="地図">
 
    <div id="message"></div>

</div>

<script>

let inactivityTimer;

function resetTimer(){

    clearTimeout(
        inactivityTimer
    );

    inactivityTimer =
    setTimeout(function(){

        showMenu();

    },60000);

}

[
"click",
"touchstart",
"mousemove",
"keydown"
].forEach(function(ev){

    document.addEventListener(
        ev,
        resetTimer
    );

});

resetTimer();


//メッセージ一覧
const genreInfo = {

"雑誌":{
location:"１階 雑誌コーナー",
detail:"詳細：雑誌（週刊誌、月刊誌など）"
},

"旅行":{
location:"１階 生活情報コーナー（棚番号２）",
detail:"詳細：国内外の旅行関連本"
},

"健康":{
location:"１階 生活情報コーナー（棚番号３）",
detail:"詳細：病気、健康法など"
},

"園芸":{
location:"１階 生活情報コーナー（棚番号４）",
detail:"詳細：園芸、ペット、コミック"
},

"文化":{
location:"１階 生活情報コーナー（棚番号５）",
detail:"詳細：華道、茶道、囲碁、将棋など"
},

"言語":{
location:"１階 生活情報コーナー（棚番号５）",
detail:"詳細：マナー、冠婚葬祭のスピーチ、手紙など"
},

"料理":{
location:"１階 家族応援コーナー",
detail:"詳細：料理"
},

"ファッション":{
location:"１階 家族応援コーナー",
detail:"詳細：裁縫、服飾、お金"
},

"家事・育児":{
location:"１階 家族応援コーナー（児童室側）",
detail:"詳細：家事・育児"
},

"児童書":{
location:"１階 児童室",
detail:"詳細：児童書、絵本、紙芝居など"
},

"YA":{
location:"２階 ＹＡコーナー",
detail:"詳細：進路、ライトノベル"
},

"パソコン":{
location:"２階 ビジネスコーナー",
detail:"詳細：政治経済・金融・パソコン関連書"
},

"小説":{
location:"２階 文庫コーナー",
detail:"詳細：小説（ライトノベル以外）"
},

"哲学・心理学・占い":{
location:"２階 一般書（棚番号１・１５）",
detail:"詳細：哲学、心理学、占い"
},

"歴史・伝記":{
location:"２階 一般書（棚番号２・３）",
detail:"詳細：歴史、伝記"
},

"福祉":{
location:"２階 一般書（棚番号３）",
detail:"詳細：年金、相続、社会問題"
},

"社会・科学":{
location:"２階 一般書（棚番号４）",
detail:"詳細：社会、科学"
},

"技術・産業":{
location:"２階 一般書（棚番号５）",
detail:"詳細：技術、産業"
},

"芸術":{
location:"２階 一般書（棚番号５・６）",
detail:"詳細：芸術"
},

"スポーツ":{
location:"２階 一般書（棚番号７）",
detail:"詳細：スポーツ"
},

"文学":{
location:"２階 一般書（棚番号８以降）",
detail:"詳細：文学"
},

"洋書":{
location:"２階 洋書コーナー",
detail:"詳細：洋書、図書館関連の本"
},

"郷土":{
location:"３階 郷土資料室",
detail:"詳細：郷土資料、住宅地図、調べ物"
},

"新刊":{
location:"１階 新刊コーナー",
detail:"詳細：新しく購入した本"
}

};

function showArea(
    fileName,
    label
){

    document.getElementById(
        "menu-screen"
    ).style.display =
    "none";

    document.getElementById(
        "detail-screen"
    ).style.display =
    "block";

    document.getElementById(
        "title"
    ).textContent =
    label;

    document.getElementById(
        "detail-image"
    ).src =
    fileName;

    const info =
        genreInfo[label] || {};

const locationElem =
    document.getElementById(
        "location"
    );

locationElem.textContent =
    info.location || "";

const len =
    locationElem.textContent.length;

if(len <= 10){
    locationElem.style.fontSize =
        "38px";
}
else if(len <= 16){
    locationElem.style.fontSize =
        "34px";
}
else if(len <= 22){
    locationElem.style.fontSize =
        "30px";
}
else{
    locationElem.style.fontSize =
        "26px";
}
    document.getElementById(
        "message"
    ).textContent =
        info.detail || "";
    }

function showMenu(){

    document.getElementById(
        "detail-screen"
    ).style.display =
    "none";

    document.getElementById(
        "menu-screen"
    ).style.display =
    "block";
}

</script>

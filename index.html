<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="図書館アプリ">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="stylesheet" href="css/style.css">

<title>図書館アプリ</title>

</head>

<body>

<div class="header">
  📚 図書館アプリ
</div>

<h4>
　☆を押して、お気に入りの図書館を登録してね
</h4>

<div id="library-list" class="library-list"></div>

<br>

<h4>
　読みたい本・読んだ本を登録してね
</h4>

<div style="text-align:center;">
  <div
    class="library-card"
    style="
      display:inline-block;
      width:90%;
      text-align:left;
    "
  >

    <div
      style="
        font-size:22px;
        font-weight:bold;
        margin-bottom:12px;
      "
    >
      📖 読書ノート
    </div>

    <div id="book-stats">
      読みたい本：0冊<br>
      予約済　　：0冊<br>
      読書中　　：0冊<br>
      読んだ本　：0冊
    </div>

    <div style="margin-top:15px;">
      <a
        class="library-button"
        href="rireki.html"
        style="
          text-align:center;
          border-radius:12px;
          padding:10px;
          background:#f5f7fa;
        "
      >
        開く
      </a>
    </div>
  </div>
</div>

<br><br>

  <img src="QR.png"
       alt="ＱＲコード"
       style="
         width:30%;
         height:auto;
         display:block;
         border-radius:16px;
         box-shadow:0 2px 8px rgba(0,0,0,0.08);
       ">
<br><br>

<div style="text-align:center;">
  <a href="mennseki.html" class="note-button">
    免責事項
  </a>
</div>

<script>

const libraries = [
{
    id: "ogk-honkan",
    name: "大垣市　本館",
    url: "./OGK/index.html"
},
{
    id: "ogk-kamishizu",
    name: "大垣市　上石津",
    url: "./KAMI/index.html"
},
{
    id: "ogk-sunomata",
    name: "大垣市　墨俣",
    url: "./SUNO/index.html"
}
];

function getFavorites() {
    return JSON.parse(
        localStorage.getItem("favoriteLibraries") || "[]"
    );
}

function saveFavorites(data) {
    localStorage.setItem(
        "favoriteLibraries",
        JSON.stringify(data)
    );
}

function toggleFavorite(id) {

    let favorites = getFavorites();

    if (favorites.includes(id)) {
        favorites = favorites.filter(x => x !== id);
    } else {
        favorites.push(id);
    }

    saveFavorites(favorites);
    renderLibraries();
}

function renderLibraries() {

    const favorites = getFavorites();

    // ☆ありを上へ移動
    // 同じグループ内は libraries の記述順を維持
    const sorted = [...libraries].sort((a, b) => {

        const af = favorites.includes(a.id);
        const bf = favorites.includes(b.id);

        if (af && !bf) return -1;
        if (!af && bf) return 1;

        return 0;
    });

    const area = document.getElementById("library-list");

    area.innerHTML = "";

    sorted.forEach(lib => {

        const isFav = favorites.includes(lib.id);

        const card = document.createElement("div");

        card.className = "library-card";

        card.innerHTML =
            '<span class="favorite ' +
            (isFav ? 'on' : 'off') +
            '" onclick="toggleFavorite(\'' + lib.id + '\')">' +
            (isFav ? '★' : '☆') +
            '</span>' +

            '<a class="library-button" href="' + lib.url + '">' +
            lib.name +
            '</a>';

        area.appendChild(card);
    });
}

renderLibraries();

function renderBookStats() {

    const books =
        JSON.parse(
            localStorage.getItem("books") || "[]"
        );

    const wishlist =
        books.filter(
            b => b.status === "wishlist" && !b.reserved
        ).length;

    const reserved =
        books.filter(
            b => b.reserved
        ).length;

    const reading =
        books.filter(
            b => b.status === "reading"
        ).length;

    const read =
        books.filter(
            b => b.status === "read"
        ).length;

    const area =
        document.getElementById("book-stats");

    if (!area) {
        return;
    }

    area.innerHTML =
        "読みたい本：" + wishlist + "冊<br>" +
        "予約済　　：" + reserved + "冊<br>" +
        "読書中　　：" + reading + "冊<br>" +
        "読んだ本　：" + read + "冊";
}

renderLibraries();
renderBookStats();

window.addEventListener(
    "pageshow",
    function() {

        renderBookStats();
        renderLibraries();

    }
);

</script>

</body>
</html>

.button-area{

.genre-btn{
    flex:0 0 31%;

    display:flex;
    flex-direction:column;
}

.btn-image{

    height:110px;

}

.btn-label{

    align-items:center;

    font-size:18px;

.top-bar{

}

#title{
    text-align:center;
    font-size:56px;
    margin-top:-70px;
    margin-bottom:10px;
}

#detail-screen{

    display:none;

    text-align:center;

    position:relative;
}

#detail-image{

}

.back-button{

#message{

#location{

function showArea(
    fileName,
    label
){

    document.getElementById(
        "menu-screen"
    ).style.display =
    "none";

    document.getElementById(
        "detail-screen"
    ).style.display =
    "block";

    document.getElementById(
        "title"
    ).textContent =
    label;

    document.getElementById(
        "detail-image"
    ).src =
    fileName;

    const info =
    genreInfo[label] || {};

    document.getElementById(
        "location"
    ).textContent =
    info.location || "";

    document.getElementById(
        "message"
    ).textContent =
    info.detail || "";
}

function showMenu(){

    document.getElementById(
        "detail-screen"
    ).style.display =
    "none";

    document.getElementById(
        "menu-screen"
    ).style.display =
    "block";
}

window.onload = function(){

    const params =
    new URLSearchParams(
        location.search
    );

    const area =
    params.get("area");

    if(!area){
        return;
    }

    const label =
    areaToGenre[area];

    if(!label){
        return;
    }

    showArea(
        imageMap[label],
        label
    );

};

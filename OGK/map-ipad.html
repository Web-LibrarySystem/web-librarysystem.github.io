.floor1{

}

.floor1 .genre-btn{

.floor-child{

.floor3 .genre-btn{
    border:3px solid #D9964A;
    box-shadow:

}

.section-title{
    font-size:34px;
    font-weight:bold;
    margin-bottom:15px;
    color:white;
    background:#0288D1;
    border-radius:8px;
    padding:8px 15px;
}

.button-area{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
}

.genre-btn{
    flex:0 0 22%;

    min-height:170px;

    border:3px solid transparent;
    border-radius:14px;

    background:white;

    cursor:pointer;

    padding:0;

    overflow:hidden;

    display:flex;
    flex-direction:column;
}

.btn-image{
    width:100%;
    height:110px;

    object-fit:contain;

    display:block;
}

.btn-label{
    flex:1;

    display:flex;
    align-items:center;
    justify-content:center;

    width:100%;

    box-sizing:border-box;

    font-size:18px;
    font-weight:bold;

    text-align:center;

    line-height:1.3;

    padding:8px;
}

.top-bar{

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    width:100%;
}

.qr-area{

    text-align:center;
}

.qr-title{

    font-size:16px;

    font-weight:bold;

    margin-bottom:5px;
}

#title{
    text-align:center;
    font-size:56px;
    margin-top:-70px;
    margin-bottom:10px;
}

#detail-screen{

    display:none;

    text-align:center;

    position:relative;
}

#detail-image{

    max-width:100%;

    max-height:1100px;
}

.back-button{

    font-size:30px;

    padding:15px 30px;

    border:none;

    border-radius:12px;

    margin-bottom:15px;
}

#qrcode{

    margin-top:0;
}

#message{

    text-align:left;

    max-width:800px;

    margin:20px auto 0 auto;

    font-size:20px;

    line-height:1.6;
}

#location{
    text-align:center;
    font-size:40px;
    font-weight:bold;
    color:#003366;

    margin-bottom:20px;

    white-space:nowrap;
}

    setTimeout(function(){

}

[
"click",
"touchstart",
"mousemove",
"keydown"
].forEach(function(ev){

    document.addEventListener(
        ev,
        resetTimer
    );

});

function showArea(
    fileName,
    label
){

    document.getElementById(
        "menu-screen"
    ).style.display =
    "none";

    document.getElementById(
        "detail-screen"
    ).style.display =
    "block";

    document.getElementById(
        "title"
    ).textContent =
    label;

    document.getElementById(
        "detail-image"
    ).src =
    fileName;

    const info =
    genreInfo[label] || {};

    document.getElementById(
        "location"
    ).textContent =
    info.location || "";

    document.getElementById(
        "message"
    ).textContent =
    info.detail || "";

    const qrArea =
    document.getElementById(
        "qrcode"
    );

    qrArea.innerHTML = "";

    new QRCode(
        qrArea,
        {
            text:
            "https://web-librarysystem.github.io/OGK/map-mobile.html?area="
            +
            areaIdMap[label],

            width:100,
            height:100
        }
    );
}

function showMenu(){

    document.getElementById(
        "detail-screen"
    ).style.display =
    "none";

    document.getElementById(
        "menu-screen"
    ).style.display =
    "block";

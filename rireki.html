function formatDateJP(dateStr) {

    if (!dateStr) {
        return "未登録";
    }

    const parts = dateStr.split("-");

    return (
        Number(parts[0]) + "年" +
        Number(parts[1]) + "月" +
        Number(parts[2]) + "日"
    );
}

/* -----------------------------------

function getTodayJP() {

    const d = new Date();

    const y = d.getFullYear();
    const m = String(
        d.getMonth() + 1
    ).padStart(2, "0");

    const day = String(
        d.getDate()
    ).padStart(2, "0");

    return `${y}-${m}-${day}`;
}

/* -----------------------------------
NDL検索（優先）
----------------------------------- */
async function fetchBookInfoFromNDL(isbn) {
 
try {
 
const url =
"https://iss.ndl.go.jp/api/sru" +
"?operation=searchRetrieve" +
"&version=1.2" +
"&recordSchema=dcndl_simple" +
"&maximumRecords=1" +
"&query=isbn=" + encodeURIComponent(isbn);
 
const res = await fetch(url);
 
if (!res.ok) {
return null;
}
 
const xmlText = await res.text();
 
const parser = new DOMParser();
const xml = parser.parseFromString(xmlText, "text/xml");
 
let title = "";
let author = "";
let yomi = "";
 
const titleNode =
xml.getElementsByTagName("dc:title")[0] ||
xml.getElementsByTagName("title")[0];
 
if (titleNode) {
title = titleNode.textContent.trim();
}
 
const creatorNode =
xml.getElementsByTagName("dc:creator")[0] ||
xml.getElementsByTagName("creator")[0];
 
if (creatorNode) {
author = creatorNode.textContent.trim();
}
 
const yomiNode =
xml.getElementsByTagName("dcndl:titleTranscription")[0] ||
xml.getElementsByTagName("titleTranscription")[0];
 
if (yomiNode) {
yomi = yomiNode.textContent.trim();
}
 
if (yomi) {
 
yomi = BooksManager.normalizeYomi(
BooksManager.kataToHira(yomi)
);
 
}
 
if (!title) {
return null;
}
 
return {
isbn,
title,
author,
yomi
};
 
} catch (e) {
 
console.log("NDL取得失敗", e);
 
return null;
 
}
 
}
 
/* -----------------------------------
OpenBD検索（予備）
----------------------------------- */
async function fetchBookInfoFromOpenBD(isbn) {
 
try {
 
const url =
"https://api.openbd.jp/v1/get?isbn=" + isbn;
 
const res = await fetch(url);
 
const data = await res.json();
 
if (!data || !data[0]) {
return null;
}
 
const summary = data[0].summary;
 
const title =
summary.title || "";
 
const author =
summary.author || "";
 
let yomi = "";
 
try {
 
const collationkey =
data[0].onix
?.DescriptiveDetail
?.TitleDetail
?.TitleElement
?.TitleText
?.collationkey;
 
if (collationkey) {
 
yomi = BooksManager.normalizeYomi(
BooksManager.kataToHira(
collationkey
)
);
 
}
 
} catch (e) {
 
console.log(e);
 
}
 
if (!yomi) {
 
yomi =
BooksManager.fallbackYomi(title);
 
}
 
return {
isbn,
title,
author,
yomi
};
 
} catch (e) {
 
console.log("OpenBD取得失敗", e);
 
return null;
 
}
 
}
 
/* -----------------------------------
書誌取得
NDL → OpenBD
----------------------------------- */
async function fetchBookInfo(isbn) {
 
const ndlInfo =
await fetchBookInfoFromNDL(isbn);
 
if (ndlInfo) {
 
if (!ndlInfo.yomi) {
 
ndlInfo.yomi =
BooksManager.fallbackYomi(
ndlInfo.title
);
 
}
 
console.log("NDL採用");
 
return ndlInfo;
 
}
 
const openbdInfo =
await fetchBookInfoFromOpenBD(isbn);
 
if (openbdInfo) {
 
console.log("OpenBD採用");
 
return openbdInfo;
 
}
 
return null;
 
}

function searchBooks() {
    const keyword =
    document.getElementById(
        "search-keyword"
    )
    .value
    .trim()
    .normalize("NFKC")
    .toLowerCase();

    if (!keyword) {

        alert(
            "検索文字を入力してください"
        );

        return;
    }

    const books =
        BooksManager.getBooks();

    const results =
        books.filter(book => {

        return (
            (book.title || "")
                .normalize("NFKC")
                .toLowerCase()
                .includes(keyword)

            ||

            (book.author || "")
                .normalize("NFKC")
                .toLowerCase()
                .includes(keyword)

            ||

            (book.isbn || "")
                .normalize("NFKC")
                .includes(keyword)

        );

    });

    showSearchResults(results);
}

   手動登録保存
----------------------------------- */
function manualSave() {

    const selectedStatus =
        document.querySelector(
            'input[name="book-status"]:checked'
        ).value;

    const info = {
        isbn: document.getElementById("m-isbn")
            .value
            .trim()
            .replace(/-/g, ""),

        title: document.getElementById("m-title")
            .value
            .trim(),

        author: document.getElementById("m-author")
            .value
            .trim(),

        yomi: document.getElementById("m-yomi")
            .value
            .trim(),

        status:
            selectedStatus === "reserved"
            ? "wishlist"
            : selectedStatus,

        comment:
        document.getElementById("m-comment")
            .value,

        createDate:
            getTodayJP(),

        regDate:
            getTodayJP(),

        finishDate:
            selectedStatus === "read"
                ? getTodayJP()
                : "",

        reserved:
            selectedStatus === "reserved"

    };

    /* 必須チェック */
    if (!info.title) {
        alert("タイトルを入力してください");
        return;
    }

    if (!info.yomi) {
        alert("よみを入力してください");
        return;
    }

    /* 重複チェック */
    const existing =
        BooksManager.findBookByIsbn(
            info.isbn
        );

    if (existing) {

    let statusName;

    if (existing.reserved) {

        statusName = "予約済";

    } else if (
        existing.status === "wishlist"
    ) {

        statusName = "読みたい本";

    } else if (
        existing.status === "reading"
    ) {

        statusName = "読書中";

    } else {

        statusName = "読んだ本";

    }

    const ok = confirm(
`この本は既に登録されています

現在の状態：
${statusName}

選択した状態へ変更しますか？`
    );

    if (!ok) {

        drawTopButtons();
        return;

    }

    const books =
        BooksManager.getBooks();

    const index =
        books.findIndex(
            b => b.isbn === info.isbn
        );

    books[index].status =
        info.status;

    books[index].reserved =
        info.reserved;

    books[index].regDate =
    getTodayJP();

    if (info.status === "read") {

        books[index].finishDate =
            getTodayJP();

    } else {

        books[index].finishDate =
            "";

    }

    localStorage.setItem(
        "books",
        JSON.stringify(books)
    );

    alert("状態を更新しました");

    let group;

    if (info.status === "wishlist") {

        group = "読みたい本";

    } else if (
        info.status === "reading"
    ) {

        group = "読書中";

    } else {

        group =
            BooksManager.getGroupFromYomi(
                existing.yomi
            );

    }

    BooksManager.renderBookList(
        currentSort,
        group,
        info.isbn
    );

    drawTopButtons();

    return;
    }

    /* 新規保存 */
    BooksManager.saveBook(info);

    let group;

    if (info.status === "wishlist") {

        group = "読みたい本";

    } else if (
        info.status === "reading"
    ) {

        group = "読書中";

    } else {

        group =
            BooksManager.getGroupFromYomi(
                info.yomi
            );

    }

    BooksManager.renderBookList(
        currentSort,
        group,
        info.isbn
    );

    alert("登録しました");

    drawTopButtons();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

/* -----------------------------------
   ファイルでバックアップ作成
----------------------------------- */
function exportJsonBackup() {

    saveLastBackupDate();

    const data =
        BooksManager.getBooks();

    const json =
        JSON.stringify(data, null, 2);

    const blob = new Blob(
        [json],
        { type: "application/json" }
    );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;
    a.download = "rireki-backup.json";

    a.click();

    URL.revokeObjectURL(url);

    alert("バックアップファイルを保存しました");
}

/* -----------------------------------
   JSONバックアップ復元
----------------------------------- */
function importJsonBackup(event) {

    const file = event.target.files[0];

    if (!file) {
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e) {

        try {

            const books =
                JSON.parse(e.target.result);

            if (!confirm(
                "現在のデータを上書きして復元しますか？"
            )) {
                return;
            }

            localStorage.setItem(
                "books",
                JSON.stringify(books)
            );

            alert("バックアップファイルから復元しました");

            BooksManager.renderBookList(
                currentSort,
                currentGroup
            );

        } catch {

            alert(
                "バックアップファイルの読み込みに失敗しました"
            );

        }

    };

    reader.readAsText(file);

}

async function saveCameraBook(isbn) {

    const info =
        await fetchBookInfo(isbn);

    const result =
        document.querySelector(
            'input[name="camera-status"]:checked'
        ).value;

    info.status =
        result === "reserved"
        ? "wishlist"
        : result;

    info.comment = "";

    info.regDate =
        getTodayJP();

    info.createDate =
        getTodayJP();

    info.finishDate =
        info.status === "read"
            ? getTodayJP()
            : "";

    info.reserved =
        result === "reserved";

    const existing =
        BooksManager.findBookByIsbn(
            info.isbn
        );

    if (existing) {

        let statusName;

        if (existing.reserved) {

            statusName = "予約済";

        } else if (
            existing.status === "wishlist"
        ) {

            statusName = "読みたい本";

        } else if (
            existing.status === "reading"
        ) {

            statusName = "読書中";

        } else {

            statusName = "読んだ本";

        }

        const ok = confirm(
`この本は既に登録されています

現在の状態：
${statusName}

選択した状態へ変更しますか？`
        );

        if (!ok) {

            drawTopButtons();
            return;

        }

        const books =
            BooksManager.getBooks();

        const index =
            books.findIndex(
                b => b.isbn === info.isbn
            );

        books[index].status =
            info.status;

        books[index].reserved =
            info.reserved;

        books[index].regDate =
            info.regDate;

        if (info.status === "read") {

            books[index].finishDate =
                getTodayJP();

        } else {

            books[index].finishDate =
                "";

        }
       
        localStorage.setItem(
            "books",
            JSON.stringify(books)
        );

        alert("状態を更新しました");

    } else {

        BooksManager.saveBook(info);

        alert("登録しました");

    }

    let group;

    if (info.status === "wishlist") {

        group = "読みたい本";

    } else if (
        info.status === "reading"
    ) {

        group = "読書中";

    } else {

        group =
            BooksManager.getGroupFromYomi(
                info.yomi
            );

    }

    BooksManager.renderBookList(
        currentSort,
        group,
        info.isbn
    );

    drawTopButtons();

}


/* -----------------------------------
   カメラ読み取り（ISBN）
----------------------------------- */
function showCamera() {

    duplicateAlertShown = false;
    cameraStopped = false;
    isProcessing = false;
    lastCode = "";

    const top =
        document.getElementById("top-area");

    top.innerHTML = "";

    const camDiv =
        document.createElement("div");

    camDiv.id = "camera";

    camDiv.style =
        "width:100%; max-width:400px; margin:auto;";

    top.appendChild(camDiv);

    const stopBtn =
        document.createElement("button");

    stopBtn.textContent =
        "読み取りを終わる";

    stopBtn.style =
        "padding:5px 5px; font-size:18px; margin-top:10px;";

    stopBtn.onclick =
        stopCamera;

    top.appendChild(stopBtn);

    let lastScanTime = 0;

    Quagga.init({

        inputStream: {
            name: "Live",
            type: "LiveStream",
            target: document.querySelector(
                "#camera"
            ),
            constraints: {
                facingMode: "environment"
            }
        },

        decoder: {
            readers: ["ean_reader"]
        }

    }, function(err) {

        if (err) {
            console.log(err);
            return;
        }

        Quagga.start();

    });

    Quagga.onDetected(
        async function(data) {

        if (cameraStopped) {
            return;
        }

        const now =
            Date.now();

        const code =
            data.codeResult.code;

        if (
            !code.startsWith("978") &&
            !code.startsWith("979")
        ) {
            return;
        }

        if (
            code === lastCode &&
            now - lastScanTime < 3000
        ) {
            return;
        }

        lastCode = code;
        lastScanTime = now;

        if (isProcessing) {
            return;
        }

        isProcessing = true;

        const isbn = code;

        const info =
            await fetchBookInfo(isbn);

        if (!info) {

            alert(
                "書誌データがありません。\n手動登録できます。"
            );

            cameraStopped = true;

            Quagga.stop();

            showManualEntryForm();

            isProcessing = false;

            return;
        }

        cameraStopped = true;

        Quagga.stop();

        showCameraRegisterForm(info);

        isProcessing = false;

    });

}


function stopCamera() {

    cameraStopped = true;

    try {
        Quagga.stop();
    } catch(e) {}

    const cam =
        document.querySelector(
            "#camera"
        );

    if (cam) {

        cam.innerHTML = "";

        cam.remove();

    }

    document.getElementById(
        "middle-area"
    ).innerHTML = "";

    drawTopButtons();
}

function backToMain() {

    drawTopButtons();

    document.getElementById(
        "book-list"
    ).innerHTML = "";

    document.getElementById(
        "list-title"
    ).textContent = "";
}

function showStatistics() {

    document.getElementById(
        "book-list"
    ).innerHTML = "";

    document.getElementById(
        "list-title"
    ).textContent = "";

    setDescription(`
        読書記録の統計情報です。<br>
        読んだ本を対象に、月別読了冊数や累計読了冊数の推移を表示します。<br>
        集計には各本の読了日を使用しています。
    `);

    const allReadBooks =
        BooksManager.getBooks()
        .filter(b => b.status === "read");

    const today = new Date();

    let startYear;
    let startMonth;

    if (statsRange === "6m") {

        startYear = today.getFullYear();
        startMonth = today.getMonth() - 5;

    } else if (statsRange === "1y") {

        startYear = today.getFullYear();
        startMonth = today.getMonth() - 11;

    } else {

        startYear = today.getFullYear();
        startMonth = today.getMonth() - 35;
    }

    const startDate =
        new Date(startYear, startMonth, 1);

    const endDate =
        new Date(
            today.getFullYear(),
            today.getMonth() + 1,
            0
        );


    const books =
        allReadBooks.filter(book => {

        if (!book.finishDate) {
            return false;
        }

        const d =
            new Date(book.finishDate);

            return (
                d >= startDate &&
                d <= endDate
            );

        });

        const currentYear =
            String(today.getFullYear());

        const currentMonth =
            currentYear + "-" +
            String(today.getMonth() + 1)
            .padStart(2, "0");

        const totalRead =
            books.length;

        const yearRead =
            books.filter(book =>
                (book.finishDate || "")
                .startsWith(currentYear)
            ).length;

    const monthRead =
        books.filter(book =>
                (book.finishDate || "")
                .startsWith(currentMonth)
        ).length;

    const periodLabel =
        `${startDate.getFullYear()}年`
        +
        `${String(startDate.getMonth()+1)}月`
        +
        " ～ "
        +
        `${endDate.getFullYear()}年`
        +
        `${String(endDate.getMonth()+1)}月`;

    const monthlyMap = {};

    const targetMonths = [];

    const cursor =
        new Date(
            startDate.getFullYear(),
            startDate.getMonth(),
            1
        );

    while (cursor <= endDate) {

        targetMonths.push(
            cursor.getFullYear()
            + "-"
            +
            String(
                cursor.getMonth() + 1
            ).padStart(2,"0")
        );

        cursor.setMonth(
            cursor.getMonth() + 1
        );
    }

    books.forEach(book => {

    if (!book.finishDate) {
        return;
    }

    const month =
        book.finishDate.substring(0, 7);

        monthlyMap[month] =
            (monthlyMap[month] || 0) + 1;
    });

const months =
    [...targetMonths];

let averagePerMonth = 0;

if (months.length > 0) {

    averagePerMonth =
        (
            totalRead /
            months.length
        ).toFixed(1);

}

let monthlyHtml = "";

if (months.length === 0) {

    monthlyHtml =
        "<div>読了データがありません。</div>";

}

let maxCount = 1;

    months.forEach(month => {

        if (
            monthlyMap[month] > maxCount
        ) {

            maxCount =
                monthlyMap[month];
        }
    });

    months.forEach(month => {

        const count =
            monthlyMap[month] || 0;

        const width =
            Math.max(
                10,
                (count / maxCount) * 180
            );

        monthlyHtml += `
        <div style="margin-bottom:10px;">

        ${month}
        （${count}冊）

        <div style="
            background:#4A90E2;
            height:20px;
            width:${width}px;
            border-radius:4px;
            margin-top:3px;
        ">
        </div>

        </div>
        `;
    });

    let running = 0;

    const cumulativeData = [];

    months.forEach(month => {

    running +=
        (monthlyMap[month] || 0);

    cumulativeData.push({
        month,
        total: running
    });

});

    let linePoints = "";

    const graphWidth = 300;
    const graphHeight = 180;

    cumulativeData.forEach((item, index) => {

        const x =
            months.length <= 1
            ? 20
            : 20 +
              (
                  index /
                  (months.length - 1)
              ) *
              (graphWidth - 40);

        const y =
            graphHeight -
            20 -
            (
                item.total /
                Math.max(totalRead, 1)
            ) *
            (graphHeight - 40);

        linePoints +=
            `${x},${y} `;
    });

    const top =
        document.getElementById(
            "top-area"
        );

    top.innerHTML = `

    <div style="text-align:left;">

    <div style="
    margin-bottom:15px;
    font-size:1.17em;
    font-weight:bold;
    ">

    集計期間：

    <select
    style="
    font-size:1em;
    font-weight:bold;
    "
    onchange="
    statsRange=this.value;
    showStatistics();
    ">

    <option value="6m"
    ${statsRange==="6m"?"selected":""}>
    直近6か月
    </option>

    <option value="1y"
    ${statsRange==="1y"?"selected":""}>
    直近1年
    </option>

    <option value="3y"
    ${statsRange==="3y"?"selected":""}>
    直近3年
    </option>

    </select>

    </div>

    <h3>読書統計</h3>

    <div style="
        background:#f5f5f5;
        padding:10px;
        border-radius:8px;
        margin-bottom:20px;
        text-align:center;
    ">

    集計期間：
    <b>${periodLabel}</b>

    <br><br>

    累計既読冊数　：
    <b>${totalRead}</b>冊

    <br><br>

    今年の既読冊数：
    <b>${yearRead}</b>冊

    <br><br>

    今月の既読冊数：
    <b>${monthRead}</b>冊

    <br><br>

    月平均既読冊数：
    <b>${averagePerMonth}</b>冊

    </div>

    <h3>月別の既読冊数</h3>

    ${monthlyHtml}

    <hr style="margin:20px 0;">

    <h3>累計既読冊数の推移</h3>

    <svg
        width="100%"
        height="220"
        viewBox="0 0 300 180"
        style="
            border:1px solid #ccc;
            background:#fff;
        ">

        <polyline
            fill="none"
            stroke="#2196F3"
            stroke-width="3"
            points="${linePoints}">
        </polyline>

    </svg>

    <br><br>

    <button
    onclick="backToMain()"
    style="
        font-size:18px;
        padding:5px 5px;
    ">
    戻る
</button>

    </div>

    `;
}

function toggleReserved(index) {

    const books =
        BooksManager.getBooks();

    const book = books[index];

    if (!book.reserved) {

        const ok = confirm(
            "実際に図書館で予約しましたか？\n\nここで予約済みにしても、図書館で予約したことにはなりません。\n\n予約済みにしますか？"
        );

        if (!ok) {
            return;
        }
    }

    book.reserved = !book.reserved;

    book.regDate =
    getTodayJP();

    localStorage.setItem(
        "books",
        JSON.stringify(books)
    );

    alert(
        book.reserved
        ? "予約済にしました"
        : "予約済を解除しました"
    );

    BooksManager.renderBookList(
        currentSort,
        "読みたい本"
    );
}

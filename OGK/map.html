<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>図書館案内アプリ</title>

<style>

body{
    margin:0;
    padding:15px;
    font-family:sans-serif;
    background:#f5f7fa;
}

h1{
    margin-top:0;
    text-align:center;
}

.section{

    margin-bottom:20px;

    padding:10px;

    border-radius:12px;

    background:white;

    box-shadow:
    0 2px 8px rgba(0,0,0,0.08);
}

.section-title{

    font-size:22px;

    font-weight:bold;

    margin-bottom:10px;
}

.button-area{

    display:flex;

    flex-wrap:wrap;

    gap:10px;
}

.genre-btn{

    width:15%;

    min-height:90px;

    border:none;

    border-radius:12px;

    background:#ffffff;

    box-shadow:
    0 2px 6px rgba(0,0,0,0.08);

    font-size:18px;

    cursor:pointer;
}

.top-bar{

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    width:100%;
}

.qr-area{

    text-align:center;
}

.qr-title{

    font-size:16px;

    font-weight:bold;

    margin-bottom:5px;
}

#title{

    text-align:center;

    font-size:48px;

    margin-top:-70px;

    margin-bottom:15px;
}

#detail-screen{

    display:none;

    text-align:center;

    position:relative;
}

#detail-image{

    max-width:100%;

    max-height:1100px;
}

.back-button{

    font-size:20px;

    padding:10px 20px;

    border:none;

    border-radius:12px;

    margin-bottom:15px;
}

#qrcode{

    margin-top:0;
}

#message{

    text-align:left;

    max-width:800px;

    margin:20px auto 0 auto;

    font-size:20px;

    line-height:1.6;
}

#home-button{

    font-size:20px;

    padding:10px 20px;

    border:none;

    border-radius:12px;

    background:white;

    box-shadow:
    0 2px 6px rgba(0,0,0,0.1);

    cursor:pointer;

    margin-bottom:10px;
}

</style>
</head>

<body>

<div id="menu-screen">

    <button
        id="home-button"
        onclick="location.href='index.html'">
        ← 戻る
    </button>

<h1>どんな本をお探しですか？</h1>

<div id="detail-screen">

    <div class="top-bar">

        <button
        class="back-button"
        onclick="showMenu()">
        ← 戻る
        </button>

        <div class="qr-area">

            <div class="qr-title">
                スマホで見る
            </div>

            <div id="qrcode"></div>

        </div>

    </div>

    <h2 id="title"></h2>

    <img
    id="detail-image"
    src=""
    alt="地図">

    <div id="message"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>

let inactivityTimer;

function resetTimer(){

    clearTimeout(
        inactivityTimer
    );

    inactivityTimer =
    setTimeout(function(){

        showMenu();

    },60000);

}

[
"click",
"touchstart",
"mousemove",
"keydown"
].forEach(function(ev){

    document.addEventListener(
        ev,
        resetTimer
    );

});

resetTimer();


//メッセージ一覧
const genreMessage = {
    "雑誌": "場所：１階　雑誌コーナー\n詳細：雑誌（週刊誌、月刊誌など）",
    "旅行": "場所：１階　生活情報コーナー（棚番号２）\n詳細：国内外の旅行関連本",
    "健康": "場所：１階　生活情報コーナー（棚番号３）\n詳細：病気、健康法など",
    "園芸": "場所：１階　生活情報コーナー（棚番号４）\n詳細：園芸、ペット、コミック",
    "文化": "場所：１階　生活情報コーナー（棚番号５）\n詳細：華道、茶道、囲碁、将棋など",
    "言語": "場所：１階　生活情報コーナー（棚番号５）\n詳細：マナー、冠婚葬祭のスピーチ、手紙など",
    "料理": "場所：１階　家族応援コーナー\n詳細：料理",
    "ファッション": "場所：１階　家族応援コーナー\n詳細：裁縫、服飾、お金",
    "家事・育児": "場所：１階　家族応援コーナー（児童室側）\n詳細：家事・育児",
    "児童書": "場所：１階　児童室\n詳細：児童書、絵本、紙芝居など",
    "YA": "場所：２階　ＹＡコーナー\n詳細：進路、ライトノベル",
    "パソコン": "場所：２階　ビジネスコーナー\n詳細：政治経済・金融・パソコン関連書",
    "小説": "場所：２階　文庫コーナー\n詳細：小説（ライトノベル以外）",
    "哲学・心理学・占い": "場所：２階　一般書（棚番号１・１５）\n詳細：哲学、心理学、占い",
    "歴史・伝記": "場所：２階　一般書（棚番号２・３）\n詳細：歴史、伝記",
    "福祉": "場所：２階　一般書（棚番号３）\n詳細：年金、相続、社会問題",
    "社会・科学": "場所：２階　一般書（棚番号４）\n詳細：社会、科学",
    "技術・産業": "場所：２階　一般書（棚番号５）\n詳細：技術、産業",
    "芸術": "場所：２階　一般書（棚番号５・６）\n詳細：芸術",
    "スポーツ": "場所：２階　一般書（棚番号７）\n詳細：スポーツ",
    "文学": "場所：２階　一般書（棚番号８以降）\n詳細：文学",
    "洋書": "場所：２階　洋書コーナー\n詳細：洋書、図書館関連の本",
    "郷土": "場所：３階　郷土資料室\n詳細：郷土資料、住宅地図、調べ物",
};


// QR用ID対応表
const areaIdMap = {
"雑誌": "magazine",
"旅行": "travel",
"健康": "health",
"園芸": "gardening",
"文化": "culture",
"言語": "genngo",
"料理": "cooking",
"ファッション": "fashion",
"家事・育児": "family",
"児童書": "children",
"YA": "ya",
"パソコン": "business",
"小説": "novel",
"哲学・心理学・占い": "psychology",
"歴史・伝記": "history",
"福祉": "welfare",
"社会・科学": "science",
"技術・産業": "technology",
"芸術": "art",
"スポーツ": "sports",
"文学": "literature",
"洋書": "yousyo",
"郷土": "kyoudo"
};






function showArea(
    fileName,
    label
){

    document.getElementById(
        "menu-screen"
    ).style.display =
    "none";

    document.getElementById(
        "detail-screen"
    ).style.display =
    "block";

    document.getElementById(
        "title"
    ).textContent =
    label;

    document.getElementById(
        "detail-image"
    ).src =
    fileName;

    document.getElementById(
        "message"
    ).innerHTML =
    (
        genreMessage[label] || ""
    ).replace(/\n/g,"<br>");

    const qrArea =
    document.getElementById(
        "qrcode"
    );

    qrArea.innerHTML = "";

    new QRCode(
        qrArea,
        {
            text:
            "https://web-librarysystem.github.io/OGK/map-mobile.html?area="
            +
            areaIdMap[label],

            width:100,
            height:100
        }
    );
}

function showMenu(){

    document.getElementById(
        "detail-screen"
    ).style.display =
    "none";

    document.getElementById(
        "menu-screen"
    ).style.display =
    "block";
}
window.addEventListener("load", function(){

    const params =
        new URLSearchParams(
            location.search
        );

    const area =
        params.get("area");

    const areaToGenre = {
        magazine: "雑誌",
        travel: "旅行",
        health: "健康",
        gardening: "園芸",
        culture: "文化",
        genngo: "言語",
        cooking: "料理",
        fashion: "ファッション",
        family: "家事・育児",
        children: "児童書",
        ya: "YA",
        business: "パソコン",
        novel: "小説",
        psychology: "哲学・心理学・占い",
        history: "歴史・伝記",
        welfare: "福祉",
        science: "社会・科学",
        technology: "技術・産業",
        art: "芸術",
        sports: "スポーツ",
        literature: "文学",
        yousyo: "洋書",
        kyoudo: "郷土"
    };

    const genreToFile = {
        "雑誌":"zassi.png",
        "旅行":"ryokou.png",
        "健康":"kennkou.png",
        "園芸":"enngei.png",
        "文化":"bunnka.png",
        "言語":"genngo.png",
        "料理":"ryouri.png",
        "ファッション":"fassyonn.png",
        "家事・育児":"kosodate.png",
        "児童書":"zidou.png",
        "YA":"YA.png",
        "パソコン":"bizinesu.png",
        "小説":"bunnko.png",
        "哲学・心理学・占い":"sinnri.png",
        "歴史・伝記":"rekisi.png",
        "福祉":"hukusi.png",
        "社会・科学":"kagaku.png",
        "技術・産業":"gizyutu.png",
        "芸術":"geizyutu.png",
        "スポーツ":"supotu.png",
        "文学":"bunngaku.png",
        "洋書":"yousyo.png",
        "郷土":"kyoudo.png"
    };

    if(area && areaToGenre[area]){

        const genre =
            areaToGenre[area];

        showArea(
            genreToFile[genre],
            genre
        );
    }

});

</script>

</body>
</html>

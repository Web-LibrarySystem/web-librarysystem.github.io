<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="館内マップ">

<title>館内マップ</title>

<style>

body{
    margin:0;
    padding:15px;
    font-family:sans-serif;
    background:#f5f7fa;
}

h1{
    margin-top:0;
    text-align:center;
}

.section{

    margin-bottom:20px;

    padding:10px;

    border-radius:12px;

    background:white;

    box-shadow:
    0 2px 8px rgba(0,0,0,0.08);
}

.section-title{

    font-size:22px;

    font-weight:bold;

    margin-bottom:10px;
}

.button-area{

    display:flex;

    flex-wrap:wrap;

    gap:10px;
}

.genre-btn{

    width:15%;

    min-height:90px;

    border:none;

    border-radius:12px;

    background:#ffffff;

    box-shadow:
    0 2px 6px rgba(0,0,0,0.08);

    font-size:18px;

    cursor:pointer;
}

.top-bar{

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    width:100%;
}

.qr-area{

    text-align:center;
}

.qr-title{

    font-size:16px;

    font-weight:bold;

    margin-bottom:5px;
}

#title{
    text-align:center;
    font-size:56px;
    margin-top:-70px;
    margin-bottom:10px;
}

#detail-screen{

    display:none;

    text-align:center;

    position:relative;
}

#detail-image{

    max-width:100%;

    max-height:1100px;
}

.back-button{

    font-size:20px;

    padding:10px 20px;

    border:none;

    border-radius:12px;

    margin-bottom:15px;
}

#qrcode{

    margin-top:0;
}

#message{

    text-align:left;

    max-width:800px;

    margin:20px auto 0 auto;

    font-size:20px;

    line-height:1.6;
}

#location{
    text-align:center;
    font-size:40px;
    font-weight:bold;
    color:#003366;

    margin-bottom:20px;

    white-space:nowrap;
}

</style>
</head>

<div id="detail-screen">

    <div class="top-bar">

        <button
        class="back-button"
        onclick="showMenu()">
        ← 戻る
        </button>

        <div class="qr-area">

            <div class="qr-title">
                スマホで見る
            </div>

            <div id="qrcode"></div>

        </div>

    </div>

    <h2 id="title"></h2>

    <div id="location"></div>

    <img
    id="detail-image"
    src=""
    alt="地図">

    <div id="message"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>

let inactivityTimer;

function resetTimer(){

    clearTimeout(
        inactivityTimer
    );

    inactivityTimer =
    setTimeout(function(){

        showMenu();

    },60000);

}

[
"click",
"touchstart",
"mousemove",
"keydown"
].forEach(function(ev){

    document.addEventListener(
        ev,
        resetTimer
    );

});

resetTimer();

// QR用ID対応表
const areaIdMap = {
"雑誌": "magazine",
"生き方": "ikikata",
"旅行": "travel",
"健康": "health",
"園芸": "gardening",
"コミック": "komi",
"文化": "culture",
"言語": "genngo",
"料理": "cooking",
"ファッション": "fashion",

"乳幼児向け":"bs.png",
"絵本":"ehon.png",
"児童書":"zidou.png",
"中高生向け": "ya",
"パソコン": "PC",
"金融商業": "kinnyuu",
"政治経済": "seizi",
"小説": "novel",

function showArea(
    fileName,
    label
){

    document.getElementById(
        "menu-screen"
    ).style.display =
    "none";

    document.getElementById(
        "detail-screen"
    ).style.display =
    "block";

    document.getElementById(
        "title"
    ).textContent =
    label;

    document.getElementById(
        "detail-image"
    ).src =
    fileName;

    const info =
    genreInfo[label] || {};

    document.getElementById(
        "location"
    ).textContent =
    info.location || "";

    document.getElementById(
        "message"
    ).textContent =
    info.detail || "";

    const qrArea =
    document.getElementById(
        "qrcode"
    );

    qrArea.innerHTML = "";

    new QRCode(
        qrArea,
        {
            text:
            "https://web-librarysystem.github.io/OGK/map-mobile.html?area="
            +
            areaIdMap[label],

            width:100,
            height:100
        }
    );
}

function showMenu(){

    document.getElementById(
        "detail-screen"
    ).style.display =
    "none";

    document.getElementById(
        "menu-screen"
    ).style.display =
    "block";
}

.button-area{

.genre-btn{
    flex:0 0 29%;

    border:3px solid transparent;
    border-radius:14px;

    cursor:pointer;

    padding:0;

    display:flex;
    flex-direction:column;
}

.btn-image{
    width:100%;
    height:110px;

    display:block;
}

.btn-label{
    flex:1;

    align-items:center;
    justify-content:center;

    width:100%;

    box-sizing:border-box;

    font-size:18px;
    font-weight:bold;

    text-align:center;

    line-height:1.3;

    padding:8px;
}

.top-bar{

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    width:100%;
}

#title{
    text-align:center;
    font-size:34px;
    margin-top:-20px;
    margin-bottom:10px;
}

#detail-screen{

    display:none;

    text-align:center;

    position:relative;
}

#detail-image{

    max-width:100%;

}

.back-button{

    font-size:30px;

    padding:20px 30px;

    border:none;

    border-radius:12px;

    margin-bottom:15px;
}

#message{

    text-align:left;

    max-width:800px;

    margin:20px auto 0 auto;

    font-size:20px;

    line-height:1.6;
}

#location{

    font-weight:bold;
    color:#003366;

function showArea(
    fileName,
    label
){

    document.getElementById(
        "menu-screen"
    ).style.display =
    "none";

    document.getElementById(
        "detail-screen"
    ).style.display =
    "block";

    document.getElementById(
        "title"
    ).textContent =
    label;

    document.getElementById(
        "detail-image"
    ).src =
    fileName;

    const info =
    genreInfo[label] || {};

    document.getElementById(
        "location"
    ).textContent =
    info.location || "";

    document.getElementById(
        "message"
    ).textContent =
    info.detail || "";
}

function showMenu(){

    document.getElementById(
        "detail-screen"
    ).style.display =
    "none";

    document.getElementById(
        "menu-screen"
    ).style.display =
    "block";
}

window.onload = function(){

    const params =
    new URLSearchParams(
        location.search
    );

    const area =
    params.get("area");

    if(!area){
        return;
    }

    const label =
    areaToGenre[area];

    if(!label){
        return;
    }

    showArea(
        imageMap[label],
        label
    );

};

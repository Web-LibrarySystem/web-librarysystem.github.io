<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>館内マップ</title>

<style>

body{
    margin:0;
    padding:10px;
    font-family:sans-serif;
    background:#f5f7fa;
}

h1{
    text-align:center;
    font-size:24px;
}

.section{
    margin-bottom:15px;
    padding:10px;
    border-radius:12px;
    background:#fff;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.section-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
}

.button-area{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.genre-btn{
    width:31%;
    min-height:80px;
    border:none;
    border-radius:12px;
    background:white;
    box-shadow:0 2px 6px rgba(0,0,0,.08);
    font-size:14px;
    cursor:pointer;
}

#detail-screen{
    display:none;
    text-align:center;
}

#title{
    font-size:32px;
    margin:10px 0;
}

#location{
    font-size:22px;
    font-weight:bold;
    color:#003366;
    margin-bottom:15px;
}

#detail-image{
    width:100%;
    height:auto;
    max-width:100%;
}

#message{
    margin-top:15px;
    text-align:left;
    font-size:16px;
    line-height:1.6;
}

.back-button{
    font-size:18px;
    padding:10px 20px;
    border:none;
    border-radius:12px;
    background:#3578e5;
    color:white;
}

</style>
</head>

<body>

<div id="menu-screen">

<h1>どんな本をお探しですか？</h1>

<!-- 生活情報コーナー -->
<div class="section">

<div class="section-title">
生活情報コーナー
</div>

<div class="button-area">

<button class="genre-btn"
onclick="showArea('zassi.png','雑誌')">
📰<br>雑誌
</button>

<button class="genre-btn"
onclick="showArea('ikikata.png','生き方')">
❤<br>生き方
</button>

<button class="genre-btn"
onclick="showArea('ryokou.png','旅行')">
✈️<br>旅行
</button>

<button class="genre-btn"
onclick="showArea('kennkou.png','健康')">
🏥<br>健康
</button>

<button class="genre-btn"
onclick="showArea('enngei.png','園芸')">
🌷<br>園芸
</button>

<button class="genre-btn"
onclick="showArea('komi.png','コミック')">
📕<br>コミック
</button>

<button class="genre-btn"
onclick="showArea('bunnka.png','文化')">
🎎<br>文化
</button>

<button class="genre-btn"
onclick="showArea('genngo.png','言語')">
📖<br>言語
</button>

</div>

</div>


<!-- 家族応援コーナー -->
<div class="section">

<div class="section-title">
家族応援コーナー
</div>

<div class="button-area">

<button class="genre-btn"
onclick="showArea('ryouri.png','料理')">
🍳<br>料理
</button>

<button class="genre-btn"
onclick="showArea('fassyonn.png','ファッション')">
👗<br>ファッション
</button>

<button class="genre-btn"
onclick="showArea('kosodate.png','家事・育児')">
👶<br>育児
</button>

</div>

</div>


<!-- 児童・YA -->
<div class="section">

<div class="section-title">
児童・YA
</div>

<div class="button-area">

<button class="genre-btn"
onclick="showArea('zidou.png','児童書')">
📚<br>児童書
</button>

<button class="genre-btn"
onclick="showArea('YA.png','YA')">
🎓<br>YA
</button>

</div>

</div>


<!-- ビジネスコーナー -->
<div class="section">

<div class="section-title">
ビジネスコーナー
</div>

<div class="button-area">

<button class="genre-btn"
onclick="showArea('PC.png','パソコン')">
💻<br>パソコン
</button>

<button class="genre-btn"
onclick="showArea('kinnyuu.png','金融商業')">
￥<br>金融商業
</button>

<button class="genre-btn"
onclick="showArea('seizi.png','政治経済')">
👨<br>政治経済
</button>

</div>

</div>


<!-- 一般書 -->
<div class="section">

<div class="section-title">
一般書
</div>

<div class="button-area">

<button class="genre-btn"
onclick="showArea('bunnko.png','小説')">
📕<br>小説
</button>

<button class="genre-btn"
onclick="showArea('sinnri.png','宗教・心理学・占い')">
🧠<br>宗教哲学
</button>

<button class="genre-btn"
onclick="showArea('rekisi.png','歴史・伝記')">
🏯<br>歴史
</button>

<button class="genre-btn"
onclick="showArea('hukusi.png','福祉')">
🤝<br>福祉
</button>

<button class="genre-btn"
onclick="showArea('kagaku.png','社会・科学')">
🔬<br>科学
</button>

<button class="genre-btn"
onclick="showArea('gizyutu.png','技術・産業')">
🏭<br>技術
</button>

<button class="genre-btn"
onclick="showArea('geizyutu.png','芸術')">
🎨<br>芸術
</button>

<button class="genre-btn"
onclick="showArea('supotu.png','スポーツ')">
⚽<br>スポーツ
</button>

<button class="genre-btn"
onclick="showArea('bunngaku.png','文学')">
📖<br>文学
</button>

</div>

</div>


<!-- その他 -->
<div class="section">

<div class="section-title">
その他
</div>

<div class="button-area">

<button class="genre-btn"
onclick="showArea('kyoudo.png','郷土')">
🏠<br>郷土
</button>

<button class="genre-btn"
onclick="showArea('sinnkann.png','新刊')">
📕<br>新刊
</button>

<button class="genre-btn"
onclick="showArea('yousyo.png','洋書')">
🌎<br>洋書
</button>

</div>

</div>

</div>

<div id="detail-screen">

<button
class="back-button"
onclick="showMenu()">
← 戻る
</button>

<h2 id="title"></h2>

<div id="location"></div>

<img
id="detail-image"
src=""
alt="地図">

<div id="message"></div>

</div>

<script>

const genreInfo = {

"雑誌":{
location:"１階 雑誌コーナー",
detail:"詳細：雑誌（週刊誌、月刊誌など）"
},

"生き方":{
location:"１階 棚番号１",
detail:"生き方・人生訓"
},

"旅行":{
location:"１階 棚番号１と２の間",
detail:"詳細：国内外の旅行関連本"
},

"健康":{
location:"１階 棚番号２と３の間",
detail:"詳細：病気、健康法など"
},

"園芸":{
location:"１階 棚番号３と４の間",
detail:"詳細：園芸、ペット"
},

"コミック":{
location:"１階 棚番号４と５の間",
detail:"詳細：コミック"
}

};

function showArea(fileName,label){

    document.getElementById(
        "menu-screen"
    ).style.display="none";

    document.getElementById(
        "detail-screen"
    ).style.display="block";

    document.getElementById(
        "title"
    ).textContent=label;

    document.getElementById(
        "detail-image"
    ).src=fileName;

    const info=
        genreInfo[label]||{};

    document.getElementById(
        "location"
    ).textContent=
        info.location || "";

    document.getElementById(
        "message"
    ).textContent=
        info.detail || "";
}

function showMenu(){

    document.getElementById(
        "detail-screen"
    ).style.display="none";

    document.getElementById(
        "menu-screen"
    ).style.display="block";
}

window.addEventListener(
"load",
function(){

const params=
new URLSearchParams(
location.search
);

const area=
params.get("area");

const areaToGenre={

magazine:"雑誌",
ikikata:"生き方",
travel:"旅行",
health:"健康",
gardening:"園芸",
komi:"コミック",
culture:"文化",
genngo:"言語",
cooking:"料理",
fashion:"ファッション",
family:"家事・育児",
children:"児童書",
ya:"YA",
PC:"パソコン",
kinnyuu:"金融商業",
seizi:"政治経済",
novel:"小説",
psychology:"宗教・心理学・占い",
history:"歴史・伝記",
welfare:"福祉",
science:"社会・科学",
technology:"技術・産業",
art:"芸術",
sports:"スポーツ",
literature:"文学",
yousyo:"洋書",
kyoudo:"郷土",
sinnkann:"新刊"

};

const genreToFile={

"雑誌":"zassi.png",
"生き方":"ikikata.png",
"旅行":"ryokou.png",
"健康":"kennkou.png",
"園芸":"enngei.png",
"コミック":"komi.png",
"文化":"bunnka.png",
"言語":"genngo.png",
"料理":"ryouri.png",
"ファッション":"fassyonn.png",
"家事・育児":"kosodate.png",
"児童書":"zidou.png",
"YA":"YA.png",
"パソコン":"PC.png",
"金融商業":"kinnyuu.png",
"政治経済":"seizi.png",
"小説":"bunnko.png",
"宗教・心理学・占い":"sinnri.png",
"歴史・伝記":"rekisi.png",
"福祉":"hukusi.png",
"社会・科学":"kagaku.png",
"技術・産業":"gizyutu.png",
"芸術":"geizyutu.png",
"スポーツ":"supotu.png",
"文学":"bunngaku.png",
"洋書":"yousyo.png",
"郷土":"kyoudo.png",
"新刊":"sinnkann.png"

};

if(area && areaToGenre[area]){

const genre=
areaToGenre[area];

showArea(
genreToFile[genre],
genre
);

}

});

</script>

</body>
</html>

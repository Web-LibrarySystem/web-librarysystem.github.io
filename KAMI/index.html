<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>上石津図書館</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="図書館アプリ">

<link rel="stylesheet" href="../css/style.css">
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../icon-512.png">

<style>

.header-title{
    color:#000000;
    text-align:center;
    font-size:30px;
    font-weight:700;
    letter-spacing:0.08em;
    font-family:
        "Hiragino Maru Gothic ProN",
        "ヒラギノ丸ゴ ProN",
        sans-serif;
    text-shadow:
        1px 1px 2px rgba(255,255,255,0.5);
}

.back-button{
    font-size:16px;
    font-weight:bold;
    padding:5px 10px;
    border:none;
    border-radius:16px;
    background:#ffffff;
    box-shadow:
        0 2px 6px rgba(0,0,0,0.12);
    cursor:pointer;
}

body {
    background:#f6faf6;
}

.header{
    background:#43A047;
}

.menu-grid{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:12px;
    padding:15px;
}

.menu-button{
    width:44%;
    min-height:80px;
    color:#43A047;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:white;
    border:none;
    border-radius:16px;

    box-shadow:0 2px 8px rgba(0,0,0,0.08);

    font-size:18px;
    font-weight:bold;

    cursor:pointer;
}

.menu-button:active{
    background:#E8F5E9;
}

.menu-icon{
    font-size:30px;
    margin-bottom:6px;
}

.top-image{
    width:100%;
    height:220px;
    object-fit:cover;
    display:block;
    margin:0;
    border-radius:0 0 10px 10px;
}

.back-button button{
    background:white;
    border:none;

    padding:10px 15px;

    border-radius:12px;

    box-shadow:
    0 2px 6px rgba(0,0,0,0.08);

    cursor:pointer;
}

.section-title{

    padding-top:10px;

    text-align:center;

    color:#666;

    font-size:15px;

    font-weight:bold;
}

/*館ごとのメインテーマ色(この下に.section-header、.section-cardを書かないこと)*/

.section-card{
    width:90%;
    margin:15px auto;
    background:#DDF0DD;
    border:1px solid #CFE3CF;
    border-radius:12px;
    overflow:hidden;
    box-sizing:border-box;

    padding:0 !important;
}

.section-header{
    background:#559966;
    color:#FFFFFF;
    text-align:center;
    font-size:22px;
    font-weight:bold;
    padding:6px 0;

    width:100%;
    margin:0;
}

</style>
</head>

<script>
function openLibraryCalendar(lib){

    const form = document.createElement("form");

    form.method = "post";
    form.action = "https://www.ocpl.ogaki.gifu.jp/opw/OPS/OPSCALEND.CSP";
    form.target = "_blank";

    const input = document.createElement("input");
    input.type = "hidden";
    input.name = "lib";
    input.value = lib;

    form.appendChild(input);

    document.body.appendChild(form);

    form.submit();

    document.body.removeChild(form);
}
</script>

<body>

<div
style="
position:relative;
width:90%;
margin:15px auto;
"
>

<button
class="back-button"
onclick="location.href='../index.html'"
style="
position:absolute;
left:0;
top:50%;
transform:translateY(-50%);
"
>
← 戻る
</button>

<div class="header-title">
📚 図書館アプリ📚
</div>

</div>

<div class="section-card">

    <div class="section-header">
        上石津図書館
    </div>

    <img
        src="top.png"
        alt="図書館トップ画像"
        class="top-image"
    >

</div>

<div class="section-card">

    <div class="section-header">
        メニュー
    </div>

    <div class="menu-grid">

    <button class="menu-button"
            onclick="location.href='https://www.ocpl.ogaki.gifu.jp/opw/OPS/OPSUSERINFO.CSP'">

        <div class="menu-icon">🔑</div>
        <div>ログイン</div>

    </button>

    <button class="menu-button"
            onclick="location.href='../rireki.html'">

        <div class="menu-icon">📖</div>
        <div>読書ノート</div>

    </button>

    <button class="menu-button"
            onclick="location.href='https://www.ocpl.ogaki.gifu.jp/'">

        <div class="menu-icon">🌐</div>
        <div>ホームページ</div>

    </button>

    <button class="menu-button"
            onclick="openLibraryCalendar(10)">

        <div class="menu-icon">📅</div>
        <div>カレンダー</div>

    </button>

    <button class="menu-button"
            onclick="location.href='https://www.ocpl.ogaki.gifu.jp/opw/OPW/OPWNEWBOOK.CSP?DB=LIB'">

        <div class="menu-icon">📚</div>
        <div>新着案内</div>

    </button>

    <button class="menu-button"
            onclick="location.href='guide.html'">

        <div class="menu-icon">ℹ️</div>
        <div>利用案内</div>

    </button>
</div>
</div>
</body>
</html>

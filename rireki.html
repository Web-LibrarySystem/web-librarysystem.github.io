<script>
let currentSort = "yomiAsc";
let currentGroup = "読んだ本";
let wishlistFilter = "all";

/* 統計期間 */
let statsRange = "6m";

/* 検索状態保持 */
window.isSearchMode = false;
window.currentSearchKeyword = "";
window.editReturnMode = "";

let descriptionVisible = false;

function goBack() {

    window.isSearchMode = false;
    window.currentSearchKeyword = "";
    window.editReturnMode = "";

    const reloadScreens = [
        "camera",
        "manual",
        "search",
        "stats",
        "backup",
        "restore",
        "edit"
    ];

    if (reloadScreens.includes(currentScreen)) {

        if (typeof Quagga !== "undefined") {
            try {
                Quagga.stop();
            } catch(e) {}
        }

        location.reload();
        return;
    }

    const backPage =
        sessionStorage.getItem("backPage");

    if (backPage) {
        location.href = backPage;
    } else {
        location.href = "index.html";
    }
}

function getRatingStars(rating) {
  rating = Number(rating) || 0;
  return "⭐".repeat(rating) + "☆".repeat(5 - rating);
}

function changeRating(bookIndex) {

  const books = BooksManager.getBooks();

  const current =
    Number(books[bookIndex].rating) || 0;

  let starsHtml = "";

  for(let i=1;i<=5;i++){
    starsHtml += `
      <span
        onclick="setRating(${bookIndex},${i})"
        style="
          font-size:20px;/*☆の大きさ*/
          cursor:pointer;
          margin:0 4px;
        ">
        ${i <= current ? "⭐" : "☆"}
      </span>
    `;
  }

  const dialog = document.createElement("div");

  dialog.id = "rating-dialog";

  dialog.style = `
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
  `;

  dialog.innerHTML = `
<div
  style="
    background:white;
    border-radius:12px;
    padding:10px;
    text-align:center;
    width:240px;
  ">
      <div
        style="
          font-size:18px;
          font-weight:bold;
          margin-bottom:10px;
        ">
        本の評価
      </div>

      <div
  style="
    white-space:nowrap;
  ">
  ${starsHtml}
</div>

<div style="margin-top:15px;">
  <button
    class="back-button"
    onclick="setRating(${bookIndex},0)">
    未評価にする
  </button>
</div>

<button
  class="back-button"
  style="margin-top:10px;"
  onclick="
    document.getElementById('rating-dialog')
    .remove();
  ">
  閉じる
</button>
    </div>
  `;

  document.body.appendChild(dialog);
}

function setRating(bookIndex, rating) {

  const books = BooksManager.getBooks();

  books[bookIndex].rating = rating;

  localStorage.setItem(
    "books",
    JSON.stringify(books)
  );

  const dialog =
    document.getElementById("rating-dialog");

if(dialog){
  dialog.remove();
}

const ratingArea =
document.getElementById(
  `rating-view-${bookIndex}`
);

if(ratingArea){

  ratingArea.innerHTML =
    "評　価：" +
    (
      rating
      ? getRatingStars(rating)
      : "未評価（タップで評価）"
    );

}

if(window.isSearchMode){

    const scrollY =
      window.scrollY;

    refreshSearchResults();

    setTimeout(() => {

      window.scrollTo({
        top: scrollY,
        behavior: "auto"
      });

    },10);

    return;
  }
}

function formatDateJP(dateStr) {

    if (!dateStr) {
        return "未登録";
    }

    const parts = dateStr.split("-");

    return (
        Number(parts[0]) + "年" +
        Number(parts[1]) + "月" +
        Number(parts[2]) + "日"
    );
}

function toggleDescription() {
const body = document.getElementById("description-body");
const btn = document.getElementById("description-toggle");
 
descriptionVisible = !descriptionVisible;
 
if (descriptionVisible) {
body.style.display = "block";
btn.textContent = "説明文を非表示";
} else {
body.style.display = "none";
btn.textContent = "説明文を表示";
}
}
 

function closeReadTabs() {
}

const area =
document.getElementById(

/* -----------------------------------
   日付作成
----------------------------------- */
function getTodayJP() {

    const d = new Date();

    const y = d.getFullYear();
    const m = String(
        d.getMonth() + 1
    ).padStart(2, "0");

    const day = String(
        d.getDate()
    ).padStart(2, "0");

    return `${y}-${m}-${day}`;
}

/* -----------------------------------
   予約済へ移動
----------------------------------- */
function moveToReserved(index) {

    const books =
        BooksManager.getBooks();

    books[index].status =
    "wishlist";

    books[index].reserved =
        true;

    books[index].finishDate =
        "";

    localStorage.setItem(
        "books",
        JSON.stringify(books)
    );

    alert("予約済の本へ移動しました");

if(window.isSearchMode){
    refreshSearchResults();
    return;
}

refreshAfterRegister(
    "読みたい本",
    books[index].isbn
);
}

/* -----------------------------------
   一覧表示（カード風＋書影フォールバック）
----------------------------------- */
BooksManager.renderBookList = function(sortType = "yomiAsc", group = null, topIsbn = null) {
 
window.currentSort = sortType;

if (group !== null) {

    currentGroup = group;

}

window.currentGroup = currentGroup;
 
const allBooks = this.getBooks();
let books = [...allBooks];
 
if (currentGroup === "読みたい本") {

    books = books.filter(book =>
        book.status === "wishlist"
    );

    if (wishlistFilter === "reservedOnly") {
        books = books.filter(book =>
            book.reserved
        );
    }

    if (wishlistFilter === "reservedExclude") {
        books = books.filter(book =>
            !book.reserved
        );
    }
} 
else if (currentGroup === "読書中") {

    books = books.filter(book =>
        book.status === "reading"
    );

} else if (currentGroup === "読んだ本") {

    books = books.filter(book =>
        book.status === "read"
    );

}
 
switch (currentSort) {

    case "yomiAsc":
        books.sort((a, b) =>
            (a.yomi || "").localeCompare(b.yomi || "")
        );
        break;

    case "yomiDesc":
        books.sort((a, b) =>
            (b.yomi || "").localeCompare(a.yomi || "")
        );
        break;

case "dateNew":
    books.sort((a, b) =>
        (b.createDate || "").localeCompare(a.createDate || "")
    );
    break;
case "dateOld":
    books.sort((a, b) =>
        (a.createDate || "").localeCompare(b.createDate || "")
    );
    break;

case "ratingHigh":
    books.sort((a, b) => {

        const ra =
            a.rating > 0
            ? a.rating
            : -1;

        const rb =
            b.rating > 0
            ? b.rating
            : -1;

        return rb - ra;
    });
    break;

case "ratingLow":
    books.sort((a, b) => {

        const ra =
            a.rating > 0
            ? a.rating
            : 999;

        const rb =
            b.rating > 0
            ? b.rating
            : 999;

        return ra - rb;
    });
    break;


case "finishNew":
    books.sort((a, b) =>
        (b.finishDate || "")
        .localeCompare(a.finishDate || "")
    );
    break;

case "finishOld":
    books.sort((a, b) =>
        (a.finishDate || "")
        .localeCompare(b.finishDate || "")
    );
    break;
}
 
if (topIsbn) {
const idx = books.findIndex(b => b.isbn === topIsbn);
 
if (idx > -1) {
const [target] = books.splice(idx, 1);
books.unshift(target);
}
}
 
const colors = [
"#FFF8D6",
"#EAF7EA",
"#EEF5FF",
"#FFEFF6",
"#FFF0DB"
];

const title =
document.getElementById("list-title");

if (currentGroup === "読みたい本") {

    title.textContent =
        "読みたい本一覧";

} else if (currentGroup === "読書中") {

    title.textContent =
        "読書中一覧";

} else if (currentGroup === "読んだ本") {

    title.textContent =
        "読んだ本一覧";

}

title.innerHTML += `
<div style="
margin-top:10px;
font-size:14px;
font-weight:bold;
color:#000;
display:flex;
align-items:left;
justify-content:left;
gap:4px;
flex-wrap:wrap;
">

<span>並び順：</span>

${currentGroup === "読みたい本" ? `
<select
onchange="
wishlistFilter=this.value;
BooksManager.renderBookList(
    currentSort,
    currentGroup
);
"
style="
font-size:14px;
font-weight:bold;
color:#000;
"
>
<option value="all"
${wishlistFilter==="all"?"selected":""}>
全件
</option>

<option value="reservedOnly"
${wishlistFilter==="reservedOnly"?"selected":""}>
予約済のみ
</option>

<option value="reservedExclude"
${wishlistFilter==="reservedExclude"?"selected":""}>
予約済除く
</option>
</select>
` : ""}

<select
onchange="
currentSort=this.value;
BooksManager.renderBookList(
    currentSort,
    currentGroup
);
"
style="
font-size:14px;
font-weight:bold;
color:#000000;
"
>
<option value="yomiAsc"
${currentSort==="yomiAsc"?"selected":""}>
五十音順（昇順）
</option>

<option value="yomiDesc"
${currentSort==="yomiDesc"?"selected":""}>
五十音順（降順）
</option>

<option value="dateNew"
${currentSort==="dateNew"?"selected":""}>
登録日（新しい順）
</option>

<option value="dateOld"
${currentSort==="dateOld"?"selected":""}>
登録日（古い順）
</option>

${currentGroup === "読んだ本" ? `
<option value="ratingHigh"
${currentSort==="ratingHigh"?"selected":""}>
評価順（高い順）
</option>

<option value="ratingLow"
${currentSort==="ratingLow"?"selected":""}>
評価順（低い順）
</option>

<option value="finishNew"
${currentSort==="finishNew"?"selected":""}>
読了日順（新しい順）
</option>

<option value="finishOld"
${currentSort==="finishOld"?"selected":""}>
読了日順（古い順）
</option>
` : ""}

</select>

</div>
`;

const list = document.getElementById("book-list");
 
list.innerHTML = "";
 
books.forEach((book, index) => {
 
const color = colors[index % colors.length];
 
const originalIndex =
allBooks.findIndex(
b => b.isbn === book.isbn
);
 
const googleUrl =
`https://books.google.com/books/content?vid=ISBN${book.isbn}&printsec=frontcover&img=1&zoom=1`;
 
const openbdUrl =
`https://cover.openbd.jp/${book.isbn}.jpg`;
 
let displayYomi = book.yomi || "";
 
if (displayYomi.length > 8) {
displayYomi =
displayYomi.substring(0, 8) + "...";
}
 
const div = document.createElement("div");
 
div.className = "book-card";
 
div.style.backgroundColor = color;
 
div.innerHTML = `
<div style="display:flex; gap:5px;">

<div style="margin-left:-1px;">

<img
src="${googleUrl}"
onerror="this.onerror=null;
this.src='${openbdUrl}';
this.onerror=function(){
    this.onerror=null;
    this.src='noimage.png';
};"
style="
width:80px;
height:110px;
object-fit:cover;
border-radius:6px;
">

</div>
<div
style="
flex:1;
min-width:0;
font-size:14px;
">

${book.reserved
? `<div style="
color:red;
font-weight:bold;
font-size:18px;
">
予約済
</div>`
: ""}

<div
class="book-title"
style="
font-size:16px;
font-weight:bold;
">

${book.title}</div>

<div class="book-meta">
著　者：${book.author}
</div>

<div class="book-meta">
登録日：
${formatDateJP(
    book.createDate
)}
</div>

<div class="book-meta">
読了日：
${formatDateJP(book.finishDate)}
</div>

${book.status === "read"
? `<div
id="rating-view-${originalIndex}"
style="
margin-top:4px;
cursor:pointer;
color:#000000 !important;
"
onclick="changeRating(${originalIndex})"
>
評　価：
${book.rating
 ? getRatingStars(book.rating)
 : "未評価（タップで評価）"}
</div>`
: ""}

${book.comment ?
`<div class="book-meta">
感　想：${
book.comment.length > 30
? book.comment.substring(0,30) + "..."
: book.comment
}
</div>`
: ""}

</div>
</div>

<div class="book-buttons">

<div class="book-buttons-top">


<button
style="
flex:1;
font-size:18px;
font-weight:bold;
padding:10px 14px;
"
onclick="
window.editReturnMode='group';
editBook(${originalIndex})
">
編集
</button>
 
<button
style="
flex:1;
font-size:18px;
font-weight:bold;
padding:10px 14px;
"
onclick="BooksManager.confirmDelete(${originalIndex})">
削除
</button>

</div>

<div class="book-buttons-bottom">

${currentGroup === "読みたい本"
? `

<button
onclick="toggleReserved(${originalIndex})">
${book.reserved
? "予約済解除"
: "予約済へ"}
</button>

<button
onclick="moveToReading(${originalIndex})">
読書中へ
</button>

<button
onclick="moveToRead(${originalIndex})">
読んだ本へ
</button>

`
: ""}

${currentGroup === "読書中"
? `
<button onclick="moveToWishlist(${originalIndex})">
読みたいへ

/* -----------------------------------
NDL検索（優先）
----------------------------------- */
async function fetchBookInfoFromNDL(isbn) {
 
try {
 
const url =
"https://iss.ndl.go.jp/api/sru" +
"?operation=searchRetrieve" +
"&version=1.2" +
"&recordSchema=dcndl_simple" +
"&maximumRecords=1" +
"&query=isbn=" + encodeURIComponent(isbn);
 
const res = await fetch(url);
 
if (!res.ok) {
return null;
}
 
const xmlText = await res.text();
 
const parser = new DOMParser();
const xml = parser.parseFromString(xmlText, "text/xml");
 
let title = "";
let author = "";
let yomi = "";
 
const titleNode =
xml.getElementsByTagName("dc:title")[0] ||
xml.getElementsByTagName("title")[0];
 
if (titleNode) {
title = titleNode.textContent.trim();
}
 
const creatorNode =
xml.getElementsByTagName("dc:creator")[0] ||
xml.getElementsByTagName("creator")[0];
 
if (creatorNode) {
author = creatorNode.textContent.trim();
}
 
const yomiNode =
xml.getElementsByTagName("dcndl:titleTranscription")[0] ||
xml.getElementsByTagName("titleTranscription")[0];
 
if (yomiNode) {
yomi = yomiNode.textContent.trim();
}
 
if (yomi) {
 
yomi = BooksManager.normalizeYomi(
BooksManager.kataToHira(yomi)
);
 
}
 
if (!title) {
return null;
}
 
return {
isbn,
title,
author,
yomi
};
 
} catch (e) {
 
console.log("NDL取得失敗", e);
 
return null;
 
}
 
}
 
/* -----------------------------------
OpenBD検索（予備）
----------------------------------- */
async function fetchBookInfoFromOpenBD(isbn) {
 
try {
 
const url =
"https://api.openbd.jp/v1/get?isbn=" + isbn;
 
const res = await fetch(url);
 
const data = await res.json();
 
if (!data || !data[0]) {
return null;
}
 
const summary = data[0].summary;
 
const title =
summary.title || "";
 
const author =
summary.author || "";
 
let yomi = "";
 
try {
 
const collationkey =
data[0].onix
?.DescriptiveDetail
?.TitleDetail
?.TitleElement
?.TitleText
?.collationkey;
 
if (collationkey) {
 
yomi = BooksManager.normalizeYomi(
BooksManager.kataToHira(
collationkey
)
);
 
}
 
} catch (e) {
 
console.log(e);
 
}
 
if (!yomi) {
 
yomi =
BooksManager.fallbackYomi(title);
 
}
 
return {
isbn,
title,
author,
yomi
};
 
} catch (e) {
 
console.log("OpenBD取得失敗", e);
 
return null;
 
}
 
}
 
/* -----------------------------------
書誌取得
NDL → OpenBD
----------------------------------- */
async function fetchBookInfo(isbn) {
 
const ndlInfo =
await fetchBookInfoFromNDL(isbn);
 
if (ndlInfo) {
 
if (!ndlInfo.yomi) {
 
ndlInfo.yomi =
BooksManager.fallbackYomi(
ndlInfo.title
);
 
}
 
console.log("NDL採用");
 
return ndlInfo;
 
}
 
const openbdInfo =
await fetchBookInfoFromOpenBD(isbn);
 
if (openbdInfo) {
 
console.log("OpenBD採用");
 
return openbdInfo;
 
}
 
return null;
 
}

function searchBooks() {
const keyword =
normalizeSearchText(
    document.getElementById(
        "search-keyword"
    ).value
);

    if (!keyword) {

        alert(
            "検索文字を入力してください"
        );

        return;
    }

    window.currentSearchKeyword = keyword;
    window.isSearchMode = true;

    const books =
        BooksManager.getBooks();

/* 未評価検索 */
if (
    keyword === "未評価" ||
    keyword === "みひょうか"
) {

    const results =
        books.filter(book =>
            book.status === "read" &&
            (!book.rating || book.rating === 0)
        );

    showSearchResults(results);
    return;
}

    const results =
        books.filter(book => {
        return (
    normalizeSearchText(
        book.title
    ).includes(keyword)
        ||
    normalizeSearchText(
        normalizeAuthorName(
            book.author
        )
    ).includes(keyword)
        ||
    normalizeSearchText(
        book.yomi
    ).includes(keyword)
        ||
    normalizeSearchText(
        book.comment
    ).includes(keyword)
        ||
        (book.isbn || "")
            .normalize("NFKC")
            .toLowerCase()
            .includes(keyword)
    );
});
    showSearchResults(results);
}

/* -----------------------------------
   更新処理
----------------------------------- */
function saveEdit(index) {

    const books = BooksManager.getBooks();

const info = {
    isbn:
        document.getElementById("e-isbn")
            .value
            .trim()
            .replace(/-/g, ""),

    title:
        document.getElementById("e-title")
            .value
            .trim(),

    author:
        document.getElementById("e-author")
            .value
            .trim(),

    yomi:
        document.getElementById("e-yomi")
            .value
            .trim(),

    createDate:
        document.getElementById(
            "e-createdate"
        ).value,

        status:
            books[index].status || "read",

        comment:
            document.getElementById(
                "e-comment"
            ).value,

        finishDate:
            document.getElementById(
                "e-finishdate"
            ).value,

reserved:
    books[index].reserved || false,

rating:
    Number(
      document.getElementById(
        "e-rating"
      ).value
    )

    };

    /* ------------------------------
       必須チェック
    ------------------------------ */
    if (!info.title) {

        alert(
            "タイトルを入力してください"
        );

        return;

    }

    if (!info.yomi) {

        alert(
            "よみを入力してください"
        );

        return;

    }

    /* ------------------------------
       ISBN重複チェック
    ------------------------------ */
    if (info.isbn) {

        const duplicate =
            books.find(
                (b, i) =>
                    i !== index &&
                    b.isbn === info.isbn
            );

        if (duplicate) {

            alert(
                "同じISBNの本が既に登録されています"
            );

            return;

        }

    }

    BooksManager.updateBook(
        index,
        info
    );

    let group;

if (info.status === "wishlist") {

    group = "読みたい本";

} else if (
    info.status === "reading"
) {

    group = "読書中";

} else {

    group = "読んだ本";

}
    alert("更新しました");

if (
    window.editReturnMode === "search"
) {
    window.editReturnMode = "";

    drawTopButtons();
    renderMonthChart();
    refreshSearchResults();
    return;
}

window.editReturnMode = "";

refreshAfterRegister(
    group,
    info.isbn
);

}

function cancelEdit() {

    if (
        window.editReturnMode === "search"
    ) {

        window.editReturnMode = "";

        refreshSearchResults();

        return;
    }

    window.editReturnMode = "";

    drawTopButtons();

    BooksManager.renderBookList(
        currentSort,
        currentGroup
    );
}

   ファイルでバックアップ作成
----------------------------------- */
function exportJsonBackup() {
    currentScreen = "backup";
    const data =
        BooksManager.getBooks();
    const json =
        JSON.stringify(data, null, 2);

    const blob = new Blob(
        [json],
        { type: "application/json" }
    );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;
    a.download = "rireki-backup.json";

    a.click();

    URL.revokeObjectURL(url);

    saveLastBackupDate();

    drawTopButtons();

    alert(
        "バックアップファイルを保存しました"
    );
}

/* -----------------------------------
   JSONバックアップ復元
----------------------------------- */
function importJsonBackup(event) {

    const file = event.target.files[0];

    if (!file) {
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e) {

        try {

            const books =
                JSON.parse(e.target.result);

            if (!Array.isArray(books)) {

                alert(
                    "バックアップファイルが不正です"
                );

                return;
            }

            if (
                books.length > 0 &&
                (
                    typeof books[0].title === "undefined" ||
                    typeof books[0].author === "undefined" ||
                    typeof books[0].status === "undefined"
                )
            ) {

                alert(
                    "読書ノート用のバックアップではありません"
                );

                return;
            }

            if (!confirm(
                "現在のデータを上書きして復元しますか？"
            )) {
                return;
            }

            localStorage.setItem(
                "books",
                JSON.stringify(books)
            );

            alert("バックアップファイルから復元しました");

            BooksManager.renderBookList(
                currentSort,
                currentGroup
            );

            drawTopButtons();

        } catch {

            alert(
                "バックアップファイルの読み込みに失敗しました"
            );

        }

    };

    reader.readAsText(file);

}

async function saveCameraBook(isbn) {

    const info =
        await fetchBookInfo(isbn);

    const result =
        document.querySelector(
            'input[name="camera-status"]:checked'
        ).value;

    info.status =
        result === "reserved"
        ? "wishlist"
        : result;

    info.comment = "";
    info.rating = 0;
    info.createDate =
        getTodayJP();

    info.finishDate =
        info.status === "read"
            ? getTodayJP()
            : "";

    info.reserved =
        result === "reserved";

    const existing =
        BooksManager.findBookByIsbn(
            info.isbn
        );

    if (existing) {

        let statusName;

        if (existing.reserved) {

            statusName = "予約済";

        } else if (
            existing.status === "wishlist"
        ) {

            statusName = "読みたい本";

        } else if (
            existing.status === "reading"
        ) {

            statusName = "読書中";

        } else {

            statusName = "読んだ本";

        }

        const ok = confirm(
`この本は既に登録されています

現在の状態：
${statusName}

選択した状態へ変更しますか？`
        );

        if (!ok) {

            drawTopButtons();
            return;

        }

        const books =
            BooksManager.getBooks();

        const index =
            books.findIndex(
                b => b.isbn === info.isbn
            );

        books[index].status =
            info.status;

        books[index].reserved =
            info.reserved;

        if (info.status === "read") {

            books[index].finishDate =
                getTodayJP();

        } else {

            books[index].finishDate =
                "";

        }
       
        localStorage.setItem(
            "books",
            JSON.stringify(books)
        );

        alert("状態を更新しました");

    } else {

        BooksManager.saveBook(info);

        alert("登録しました");

    }

    let group;

    
if (info.status === "wishlist") {

    group = "読みたい本";

} else if (
    info.status === "reading"
) {

    group = "読書中";

} else {

    group = "読んだ本";

}

refreshAfterRegister(
    group,
    info.isbn
);
}

function showCamera() {
    currentScreen = "camera";
    duplicateAlertShown = false;
    cameraStopped = false;
    isProcessing = false;
    lastCode = "";

document.getElementById(
    "month-chart-area"
).style.display = "none";

    const top =
        document.getElementById("top-area");

top.innerHTML = `
<div style="
    text-align:left;
    font-size:16px;
    font-weight:bold;
    color:#005588;
    margin-bottom:10px;
">
本の裏面の２段になっているバーコードをカメラで読み取ってください。
</div>
`;

const camDiv =
    document.createElement("div");

camDiv.id = "camera";

camDiv.style =
    "width:100%; max-width:280px; height:220px; margin:0 auto; overflow:hidden; border-radius:12px;";

    top.appendChild(camDiv);

    const stopBtn =
        document.createElement("button");

    stopBtn.textContent =
        "読み取りを終わる";

    stopBtn.className = "round-button";
    stopBtn.style =
        "margin-top:10px;";

    stopBtn.onclick =
        stopCamera;

    top.appendChild(stopBtn);

    let lastScanTime = 0;

    Quagga.init({

        inputStream: {
            name: "Live",
            type: "LiveStream",
            target: document.querySelector(
                "#camera"
            ),
            constraints: {
                facingMode: "environment"
            }
        },

        decoder: {
            readers: ["ean_reader"]
        }

    }, function(err) {

        if (err) {
            console.log(err);
            return;
        }

        Quagga.start();

    });

    Quagga.onDetected(
        async function(data) {

        if (cameraStopped) {
            return;
        }

        const now =
            Date.now();

        const code =
            data.codeResult.code;

        if (
            !code.startsWith("978") &&
            !code.startsWith("979")
        ) {
            return;
        }

        if (
            code === lastCode &&
            now - lastScanTime < 3000
        ) {
            return;
        }

        lastCode = code;
        lastScanTime = now;

        if (isProcessing) {
            return;
        }

        isProcessing = true;

        const isbn = code;

        const info =
            await fetchBookInfo(isbn);

        if (!info) {

            alert(
                "書誌データがありません。\n手動登録できます。"
            );

            cameraStopped = true;

            Quagga.stop();

            showManualEntryForm();

            isProcessing = false;

            return;
        }

        cameraStopped = true;

        Quagga.stop();

        showCameraRegisterForm(info);

        isProcessing = false;

    });

}


function stopCamera() {
    cameraStopped = true;

    document.getElementById(
        "month-chart-area"
    ).style.display = "block";

    try {
        Quagga.stop();

    } catch(e) {}

    const cam =
        document.querySelector(
            "#camera"
        );

    if (cam) {

        cam.innerHTML = "";

        cam.remove();

    }

    document.getElementById(
        "middle-area"
    ).innerHTML = "";

    drawTopButtons();
}

/* -----------------------------------
   作家名正規化
----------------------------------- */
function normalizeAuthorName(author) {

  let name = (author || "")
    .normalize("NFKC")
    .trim();

  // NDL形式
  // 宮部,みゆき,1960-
  // 夏目,漱石,1867-1916
  // 東野,圭吾,1958-
  if (/^[^,]+,[^,]+,\s*\d{4}(-\d{4})?-?$/.test(name)) {
    const parts = name.split(",");
    name = parts[0] + parts[1];
  }

  return name

    // 空白除去
    .replace(/\s+/g, "")

    // 丸括弧内情報除去
    .replace(/\([^)]*\)/g, "")
    .replace(/（[^）]*）/g, "")

    // 角括弧内情報除去
    .replace(/\[[^\]]*\]/g, "")
    .replace(/［[^］]*］/g, "")

    // 生没年除去
    .replace(/,\d{4}-?$/g, "")
    .replace(/,\d{4}-\d{4}$/g, "")

    // 残ったカンマ除去
    .replace(/,/g, "")

    // 役割表記除去
    .replace(/著$/g, "")
    .replace(/編$/g, "")
    .replace(/訳$/g, "")
    .replace(/監修$/g, "")
    .replace(/原作$/g, "")
    .replace(/文$/g, "")
    .replace(/写真$/g, "")
    .replace(/構成$/g, "")

    .trim();
}

function normalizeSearchText(text){

  return (text || "")
    .normalize("NFKC")
    .toLowerCase()
    .replace(/\s+/g,"")
    .replace(/[、，,]/g,"")
    .replace(/・/g,"")
    .trim();

}

/* -----------------------------------
   予約状態切替
----------------------------------- */
function toggleReserved(index) {

    const books =
        BooksManager.getBooks();

    const book = books[index];

    if (!book.reserved) {

        const ok = confirm(
            "実際に図書館で予約しましたか？\n\nここで予約済みにしても、図書館で予約したことにはなりません。\n\n予約済みにしますか？"
        );

        if (!ok) {
            return;
        }
    }

    book.reserved = !book.reserved;

    localStorage.setItem(
        "books",
        JSON.stringify(books)
    );

alert(
book.reserved
? "予約済にしました"
: "予約済を解除しました"
);

if(window.isSearchMode){
    refreshSearchResults();
    return;
}

refreshAfterRegister(
    "読みたい本",
    book.isbn
);
}
